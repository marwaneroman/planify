# Planify — CI test workflow
# Runs backend tests, frontend unit/integration tests, and optional E2E.
name: Test

on:
  push:
    branches: [integrate, master]
  pull_request:
    branches: [integrate, master]

env:
  NODE_VERSION: "20"

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run backend unit tests (no DB)
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Run backend DB connection check
        run: npm run test:db
        env:
          DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/planify_test?schema=public"
          REQUIRE_DB_TEST: "true"

      - name: Run backend integration tests
        run: npx prisma db push --accept-data-loss && npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/planify_test?schema=public"
          JWT_SECRET: test-secret-for-ci

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit/integration tests
        run: npm test

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: |
          npx vite preview --port 4173 &
          sleep 5
          npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:4173"

  full-test:
    name: Full test summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "Backend and frontend tests passed"
        if: needs.backend-test.result != 'skipped' && needs.frontend-test.result != 'skipped'
