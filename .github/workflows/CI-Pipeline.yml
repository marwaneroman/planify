# Lint → Secret Scan → SAST → Unit Tests → Dependency Audit → Build → Container Scan → Integration → E2E → Push
name: CI-Pipeline

on:
  push:
    branches: [integrate, main]
  pull_request:
    branches: [integrate, main]

env:
  NODE_VERSION: "20"
  # AWS ECR settings — set AWS_ACCOUNT_ID and AWS_REGION as repo variables,
  # and AWS_ROLE_ARN as a repo secret.
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read
  id-token: write   # required for OIDC → AWS role assumption

jobs:
  # 1. LINT
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # 2. SECRET SCAN (full git history)
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed to catch old commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        # Remove Later continue-on-error: true
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. SAST — Semgrep static analysis (informational only; never blocks the pipeline)
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/typescript
            p/react
            p/nodejs
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # 4. UNIT TESTS + DEPENDENCY AUDIT
  unit-tests:
    name: Unit Tests & Dependency Audit
    runs-on: ubuntu-latest
    needs: [secret-scan, sast]
    strategy:
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        run: npx prisma generate

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/coverage/
          retention-days: 7

  # 5. BUILD DOCKER IMAGES (local)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      image-version: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: OIDC Test
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --- Backend ---
      - name: Build backend image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true  # load into local daemon for scanning
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend ---
      - name: Build frontend image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6. CONTAINER SCAN (Trivy) — before push
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild locally for scanning (images don't persist between jobs)
      - name: Rebuild backend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: planify/backend:scan
          cache-from: type=gha

      - name: Rebuild frontend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: planify/frontend:scan
          cache-from: type=gha

      # --- Scan backend ---
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: planify/backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # --- Scan frontend ---
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: planify/frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend


  # 7. INTEGRATION TESTS
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: container-scan
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run DB migrations
        run: timeout 120 npx prisma db push --accept-data-loss
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/planify_test?schema=public&connect_timeout=5"

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/planify_test?schema=public&connect_timeout=5"
          JWT_SECRET: test-secret-for-ci

  # 8. E2E TESTS
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:4173"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # 9. PUSH IMAGES TO AWS ECR
  push-images:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      # --- Push backend ---
      - name: Build and push backend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Push frontend ---
      - name: Build and push frontend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Output the full image URIs for downstream use (e.g. ECS task definition update)
      - name: Output pushed image URIs
        run: |
          echo "backend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}"
          echo "frontend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}"


  # SUMMARY
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, sast, unit-tests, build, container-scan, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "Lint:                ${{ needs.lint.result }}"
          echo "Secret scan:         ${{ needs.secret-scan.result }}"
          echo "SAST (Semgrep):      ${{ needs.sast.result }}"
          echo "Unit tests:          ${{ needs.unit-tests.result }}"
          echo "Build:               ${{ needs.build.result }}"
          echo "Container scan:      ${{ needs.container-scan.result }}"
          echo "Integration tests:   ${{ needs.integration-tests.result }}"
          echo "E2E tests:           ${{ needs.e2e-tests.result }}"

          if [[ "${{ needs.sast.result }}" == "failure" ]]; then
            echo "::warning::SAST (Semgrep) reported findings or failed — pipeline continues (non-blocking)"
          fi

          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.container-scan.result }}" \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.e2e-tests.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ One or more pipeline stages failed"
              exit 1
            fi
          done

          echo "✅ Full pipeline passed"