# ================================================================
#  CD Pipeline — AWS (ECR + ECS Fargate). 
# ================================================================
#
#  Architecture:
#    GitHub Actions → ECR (signed image) → ECS Fargate 
#    Auth: OIDC (no long-lived AWS keys stored anywhere)
#    Signing: Cosign keyless via GitHub OIDC
#    Deployment: ECS native canary (10% → 100%) with CloudWatch
#                alarm-based auto-rollback
#
#  Prerequisites (do these once before running):
#    1. Run the bootstrap script:  ./scripts/bootstrap-aws.sh
#       This creates the IAM OIDC provider, roles, and CW alarms.
#    2. Create GitHub Environments in repo Settings → Environments:
#         • staging    — no protection rules
#         • production — add Required reviewers
#       (Optional) You can set a deployment URL on each environment in the
#       GitHub UI for a “View deployment” link — the workflow does not require it.
#    3. Set GitHub secrets (listed below)
# 
#  Required GitHub Secrets:
#    AWS_ACCOUNT_ID          — 12-digit AWS account number
#    AWS_REGION              — e.g. us-east-1
#    AWS_ROLE_ARN_STAGING    — IAM role ARN for staging deploys
#    AWS_ROLE_ARN_PRODUCTION — IAM role ARN for prod deploys
#    ECR_REPOSITORY_BACKEND  — ECR repo name or repository ARN (…:repository/planify/backend)
#    ECR_REPOSITORY_FRONTEND — ECR repo name or repository ARN (…:repository/planify/frontend)
#    ECS_CLUSTER_STAGING     — ECS cluster name for staging
#    ECS_CLUSTER_PRODUCTION  — ECS cluster name for production
#    ECS_SERVICE_STAGING     — ECS service name (one service; task has backend + frontend containers)
#    ECS_SERVICE_PRODUCTION  — ECS service name (production)
#    ECS_CONTAINER_NAME_BACKEND  — ECS containerDefinitions[].name (backend container)
#    ECS_CONTAINER_NAME_FRONTEND — ECS containerDefinitions[].name (frontend container)
#       Use repo/org Variables OR Secrets — same keys; Vars are preferred (names are non-secret).
#    CW_ALARM_STAGING        — CloudWatch alarm name for staging
#    CW_ALARM_PRODUCTION     — CloudWatch alarm name for production
#    SLACK_WEBHOOK_URL       — Slack incoming webhook
#
#  Recommended GitHub Variables:
#    STAGING_URL             — e.g. http://your-alb-123.region.elb.amazonaws.com (smoke tests + ZAP)
#
# ================================================================

name: CD Pipeline (AWS)

# CD runs after CI finishes so ECR :latest exists before sign-image pulls it.
on:
 workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [integrate, master]

# Just for testing, should be removed after
#on:
#  push:
#    branches: [integrate, master]
#  pull_request:
 #   branches: [integrate, master]
# End of testing

permissions:
  contents: read

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID:    ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY:      ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG:         ${{ github.event.workflow_run.head_sha || github.sha  }}
  DEPLOY_SHA:        ${{ github.event.workflow_run.head_sha || github.sha  }}

# ──────────────────────────────────────────────────────────────
# 0. Guard — abort if CI did not pass 
# ──────────────────────────────────────────────────────────────
jobs:
  guard:
    name: Guard — CI must pass
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Guard notice
        run: |
          echo "CD starting for CI run ${{ github.event.workflow_run.id }} @ ${{ github.event.workflow_run.head_sha }}"

  # ──────────────────────────────────────────────────────────────
  # 1. Re-tag & sign the images that CI pushed to ECR
  #
  #    CI already pushed :latest to each ECR repository (backend + frontend).
  #    We add an immutable SHA tag and sign each image by digest.
  #    No secrets in the pipeline — auth is via OIDC.
  # ──────────────────────────────────────────────────────────────
  sign-image:
    name: Tag & sign images (keyless OIDC)
    runs-on: ubuntu-latest
    needs: guard

    permissions:
      id-token: write   # needed for OIDC → AWS + Cosign
      contents: read

    # Job outputs: use underscore keys only. Hyphenated step output names (e.g. image-uri)
    # are unreliable when mapped through job.outputs / needs.*.outputs (parsed like subtraction).
    outputs:
      ecr_repo_backend:       ${{ steps['ecr-repos'].outputs.backend }}
      ecr_repo_frontend:      ${{ steps['ecr-repos'].outputs.frontend }}
      backend_image_uri:      ${{ steps['tag-backend'].outputs.image_uri }}
      backend_image_digest:   ${{ steps['tag-backend'].outputs.image_digest }}
      backend_cosign_ref:     ${{ steps['tag-backend'].outputs.cosign_ref }}
      frontend_image_uri:     ${{ steps['tag-frontend'].outputs.image_uri }}
      frontend_image_digest:  ${{ steps['tag-frontend'].outputs.image_digest }}
      frontend_cosign_ref:    ${{ steps['tag-frontend'].outputs.cosign_ref }}

    steps:
      - name: Resolve ECR repository name (ARN or plain name)
        id: ecr-repos
        env:
          BACKEND_SECRET:  ${{ secrets.ECR_REPOSITORY_BACKEND }}
          FRONTEND_SECRET: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
        run: |
          backend="$BACKEND_SECRET"
          frontend="$FRONTEND_SECRET"
          backend=$(echo -n "$backend" | tr -d '\r\n')
          frontend=$(echo -n "$frontend" | tr -d '\r\n')
          if [[ "$backend" == arn:aws:ecr:*:repository/* ]]; then
            backend="${backend#*:repository/}"
          fi
          if [[ "$frontend" == arn:aws:ecr:*:repository/* ]]; then
            frontend="${frontend#*:repository/}"
          fi
          echo "backend=$backend"  >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Pull :latest from each repo CI pushed, add immutable SHA tags, push.
      - name: Add immutable SHA tag (backend)
        id: tag-backend
        run: |
          LATEST="${{ env.ECR_REGISTRY }}/${{ steps['ecr-repos'].outputs.backend }}:latest"
          SHA_TAG="${{ env.ECR_REGISTRY }}/${{ steps['ecr-repos'].outputs.backend }}:${{ env.IMAGE_TAG }}"

          docker pull "$LATEST"
          docker tag  "$LATEST" "$SHA_TAG"
          docker push "$SHA_TAG"

          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG")
          REPO_DIGEST=$(echo -n "$REPO_DIGEST" | tr -d '\r\n')
          if [[ -z "$REPO_DIGEST" || "$REPO_DIGEST" != *@* ]]; then
            echo "Could not read RepoDigests for $SHA_TAG (got '$REPO_DIGEST')"
            exit 1
          fi
          DIGEST="${REPO_DIGEST#*@}"

          echo "image_uri=$SHA_TAG"      >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST"    >> "$GITHUB_OUTPUT"
          echo "cosign_ref=$REPO_DIGEST" >> "$GITHUB_OUTPUT"

          mkdir -p cd-refs
          printf '%s' "$REPO_DIGEST" > cd-refs/backend.txt
          echo "Backend image: $SHA_TAG ($DIGEST)"

      - name: Add immutable SHA tag (frontend)
        id: tag-frontend
        run: |
          LATEST="${{ env.ECR_REGISTRY }}/${{ steps['ecr-repos'].outputs.frontend }}:latest"
          SHA_TAG="${{ env.ECR_REGISTRY }}/${{ steps['ecr-repos'].outputs.frontend }}:${{ env.IMAGE_TAG }}"

          docker pull "$LATEST"
          docker tag  "$LATEST" "$SHA_TAG"
          docker push "$SHA_TAG"

          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG")
          REPO_DIGEST=$(echo -n "$REPO_DIGEST" | tr -d '\r\n')
          if [[ -z "$REPO_DIGEST" || "$REPO_DIGEST" != *@* ]]; then
            echo "Could not read RepoDigests for $SHA_TAG (got '$REPO_DIGEST')"
            exit 1
          fi
          DIGEST="${REPO_DIGEST#*@}"

          echo "image_uri=$SHA_TAG"      >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST"    >> "$GITHUB_OUTPUT"
          echo "cosign_ref=$REPO_DIGEST" >> "$GITHUB_OUTPUT"

          mkdir -p cd-refs
          printf '%s' "$REPO_DIGEST" > cd-refs/frontend.txt
          echo "Frontend image: $SHA_TAG ($DIGEST)"

      - name: Persisted cosign refs (debug + guard)
        run: |
          set -euo pipefail
          test -s cd-refs/backend.txt
          test -s cd-refs/frontend.txt
          echo "::group::cosign refs (artifact source — not job outputs)"
          wc -c cd-refs/backend.txt cd-refs/frontend.txt
          grep -q '@sha256:' cd-refs/backend.txt
          grep -q '@sha256:' cd-refs/frontend.txt
          echo "backend (prefix): $(head -c 60 cd-refs/backend.txt)..."
          echo "frontend (prefix): $(head -c 60 cd-refs/frontend.txt)..."
          echo "::endgroup::"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Sign by digest — signatures are stored in the same ECR repo as .sig tags.
      - name: Sign images (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "$(tr -d '\n\r' < cd-refs/backend.txt)"
          cosign sign --yes "$(tr -d '\n\r' < cd-refs/frontend.txt)"

      # Directory must not be dot-prefixed: upload-artifact@v4 excludes hidden paths by default.
      - name: Upload cosign refs for deploy jobs (immutable digest; ECS uses these refs)
        uses: actions/upload-artifact@v4
        with:
          name: cosign-image-refs
          path: cd-refs/
          if-no-files-found: error
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # 2. Deploy to staging (ECS rolling update) 
  #    One ECS service whose task definition defines both containers.
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging (ECS)
    runs-on: ubuntu-latest
    needs: sign-image

    environment:
      name: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout (for task definition file)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download cosign image refs (immutable digest form)
        uses: actions/download-artifact@v4
        with:
          name: cosign-image-refs
          path: cd-refs

      - name: Configure AWS credentials (OIDC — staging role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signatures
        env:
          COSIGN_EXPERIMENTAL: "1"
          BK_JOB_REF: ${{ needs['sign-image'].outputs.backend_cosign_ref }}
          FE_JOB_REF: ${{ needs['sign-image'].outputs.frontend_cosign_ref }}
        run: |
          set -euo pipefail

          echo "::group::Locate issue: job.outputs (often empty due to hyphen parsing)"
          echo "backend-cosign-ref from needs length: ${#BK_JOB_REF}"
          echo "frontend-cosign-ref from needs length: ${#FE_JOB_REF}"
          echo "::endgroup::"

          echo "::group::Refs from artifact (source of truth for verify)"
          ls -la cd-refs
          wc -c cd-refs/backend.txt cd-refs/frontend.txt
          for img in backend frontend; do
            f="cd-refs/$img.txt"
            if ! grep -q '@sha256:' "$f"; then
              echo "::error::$f missing registry/repo@sha256:… form — first chars: $(head -c 120 "$f"; echo)"
              exit 1
            fi
            echo "$img artifact byte count: $(wc -c < "$f" | tr -d ' ')"
          done
          echo "::endgroup::"

          BK="$(tr -d '\n\r' < cd-refs/backend.txt)"
          FE="$(tr -d '\n\r' < cd-refs/frontend.txt)"
          echo "Parsed backend ref length: ${#BK} frontend length: ${#FE}"
          if [[ -z "$BK" || -z "$FE" ]]; then
            echo "::error::Artifact refs empty (download/sign step failed?). See sign-image job artifact upload step."
            exit 1
          fi

          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "$BK"

          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "$FE"

      - name: Set ECS image refs from signed artifact (digest pin; avoids flaky job.outputs)
        id: ecs_images
        run: |
          set -euo pipefail
          for img in backend frontend; do
            f="cd-refs/$img.txt"
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
            grep -q '@sha256:' "$f" || { echo "::error::$f must be registry/repo@sha256:…"; exit 1; }
          done
          BK=$(tr -d '\n\r' < cd-refs/backend.txt)
          FE=$(tr -d '\n\r' < cd-refs/frontend.txt)
          echo "backend_image=$BK" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FE" >> "$GITHUB_OUTPUT"
          echo "ECS will use digest-pinned images (lengths): backend=${#BK} frontend=${#FE}"

      - name: Download current staging task definition
        run: |
          TASK_ARN=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER_STAGING }}" \
            --services "${{ secrets.ECS_SERVICE_STAGING }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_ARN" \
            --query taskDefinition \
            > task-def-staging.json

      - name: Confirm ECS container names are configured (vars || secrets)
        env:
          BACKEND_CTR: ${{ vars.ECS_CONTAINER_NAME_BACKEND || secrets.ECS_CONTAINER_NAME_BACKEND }}
          FRONTEND_CTR: ${{ vars.ECS_CONTAINER_NAME_FRONTEND || secrets.ECS_CONTAINER_NAME_FRONTEND }}
        run: |
          if [[ -z "${BACKEND_CTR// /}" ]] || [[ -z "${FRONTEND_CTR// /}" ]]; then
            echo "::error::ECS_CONTAINER_NAME_BACKEND / ECS_CONTAINER_NAME_FRONTEND are empty." \
              "Define them as Actions Variables **or** Secrets (Settings → Secrets and variables)."
            exit 1
          fi

      - name: Render task definition (backend image)
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-def-staging.json
          container-name:   ${{ vars.ECS_CONTAINER_NAME_BACKEND || secrets.ECS_CONTAINER_NAME_BACKEND }}
          image:            ${{ steps.ecs_images.outputs.backend_image }}

      - name: Render task definition (frontend image)
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  ${{ steps['task-def-backend'].outputs['task-definition'] }}
          container-name:   ${{ vars.ECS_CONTAINER_NAME_FRONTEND || secrets.ECS_CONTAINER_NAME_FRONTEND }}
          image:            ${{ steps.ecs_images.outputs.frontend_image }}

      - name: Deploy to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:         ${{ steps['task-def-frontend'].outputs['task-definition'] }}
          service:                 ${{ secrets.ECS_SERVICE_STAGING }}
          cluster:                 ${{ secrets.ECS_CLUSTER_STAGING }}
          wait-for-service-stability: true

  # ──────────────────────────────────────────────────────────────
  # 3a. Smoke tests (run in parallel with DAST)
  # ──────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke tests — staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Health & critical path checks
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "${BASE:-}" ]; then
            echo "::notice::Set GitHub Actions variable STAGING_URL (e.g. http://your-alb-dns.region.elb.amazonaws.com) to run smoke checks."
            exit 0
          fi

          check() {
            local url="$1" expected="$2"
            local status
            status=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" != "$expected" ]; then
              echo "FAIL  $url → HTTP $status (expected $expected)"
              exit 1
            fi
            echo "PASS  $url → HTTP $status"
          }

          check "$BASE/health"          "200"
          check "$BASE/readiness"       "200"
          check "$BASE/api/v1/status"   "200"
          # Add your own critical paths here

      - name: API contract check
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "${BASE:-}" ]; then
            echo "::notice::Skipping API contract check (STAGING_URL not set)."
            exit 0
          fi
          BODY=$(curl -sf --max-time 10 "$BASE/api/v1/status")
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'status' in d,          'Missing status field'
          assert d['status'] == 'ok',    f\"Unexpected status: {d['status']}\"
          print('API contract OK')
          "

  # ──────────────────────────────────────────────────────────────
  # 3b. DAST — OWASP ZAP baseline scan on staging 
  # ──────────────────────────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    permissions:
      issues: write   # ZAP action opens/updates a GitHub Issue with findings

    steps:
      - name: Checkout (for .zap/rules.tsv)
        uses: actions/checkout@v4

      - name: Skip ZAP when STAGING_URL unset
        if: ${{ vars.STAGING_URL == '' }}
        run: echo "::notice::Set GitHub variable STAGING_URL to run OWASP ZAP on staging."

      - name: Run OWASP ZAP baseline scan
        if: ${{ vars.STAGING_URL != '' }}
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target:            ${{ vars.STAGING_URL }}
          rules_file_name:   ".zap/rules.tsv"
          fail_action:       true
          artifact_name:     "zap-report"

  # ──────────────────────────────────────────────────────────────
  # 4. Approval gate — blocks production until a reviewer approves
  #    in the GitHub Environments UI.
  #
  #    Setup: Settings → Environments → production
  #           → Required reviewers → add your team
  # ──────────────────────────────────────────────────────────────
  approval-gate:
    name: Approval gate
    runs-on: ubuntu-latest
    needs: [smoke-tests, dast]

    environment:
      name: production

    steps:
      - name: Approved — proceeding to production
        run: echo "Production deployment approved."

  # ──────────────────────────────────────────────────────────────
  # 5. Deploy to production
  #
  #    Uses ECS native canary deployment (announced Oct 2025):
  #      • 10% traffic → new revision
  #      • CloudWatch alarm monitors error rate during bake time
  #      • If alarm fires → ECS auto-rolls back, no human needed
  #      • If healthy → 100% traffic shifts to new revision
  #
  #    The canary config is set on the ECS service itself
  #    (see bootstrap script). This job just triggers the deploy
  #    and waits for stability.
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → production (ECS canary 10%→100%)
    runs-on: ubuntu-latest
    needs: [approval-gate, sign-image]

    permissions:
      id-token: write
      contents: read

    outputs:
      previous-task-def: ${{ steps['get-current'].outputs['previous-task-def'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download cosign image refs (immutable digest form)
        uses: actions/download-artifact@v4
        with:
          name: cosign-image-refs
          path: cd-refs

      - name: Configure AWS credentials (OIDC — production role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signatures (pre-prod)
        env:
          COSIGN_EXPERIMENTAL: "1"
          BK_JOB_REF: ${{ needs['sign-image'].outputs.backend_cosign_ref }}
          FE_JOB_REF: ${{ needs['sign-image'].outputs.frontend_cosign_ref }}
        run: |
          set -euo pipefail

          echo "::group::Locate issue: job.outputs (often empty due to hyphen parsing)"
          echo "backend-cosign-ref from needs length: ${#BK_JOB_REF}"
          echo "frontend-cosign-ref from needs length: ${#FE_JOB_REF}"
          echo "::endgroup::"

          echo "::group::Refs from artifact (source of truth for verify)"
          ls -la cd-refs
          wc -c cd-refs/backend.txt cd-refs/frontend.txt
          for img in backend frontend; do
            f="cd-refs/$img.txt"
            if ! grep -q '@sha256:' "$f"; then
              echo "::error::$f missing registry/repo@sha256:… form — first chars: $(head -c 120 "$f"; echo)"
              exit 1
            fi
            echo "$img artifact byte count: $(wc -c < "$f" | tr -d ' ')"
          done
          echo "::endgroup::"

          BK="$(tr -d '\n\r' < cd-refs/backend.txt)"
          FE="$(tr -d '\n\r' < cd-refs/frontend.txt)"
          echo "Parsed backend ref length: ${#BK} frontend length: ${#FE}"
          if [[ -z "$BK" || -z "$FE" ]]; then
            echo "::error::Artifact refs empty (download/sign step failed?). See sign-image job artifact upload step."
            exit 1
          fi

          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "$BK"

          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "$FE"

      - name: Set ECS image refs from signed artifact (digest pin; avoids flaky job.outputs)
        id: ecs_images
        run: |
          set -euo pipefail
          for img in backend frontend; do
            f="cd-refs/$img.txt"
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
            grep -q '@sha256:' "$f" || { echo "::error::$f must be registry/repo@sha256:…"; exit 1; }
          done
          BK=$(tr -d '\n\r' < cd-refs/backend.txt)
          FE=$(tr -d '\n\r' < cd-refs/frontend.txt)
          echo "backend_image=$BK" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FE" >> "$GITHUB_OUTPUT"
          echo "ECS will use digest-pinned images (lengths): backend=${#BK} frontend=${#FE}"

      - name: Record current task definition (for rollback)
        id: get-current
        run: |
          CURRENT=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER_PRODUCTION }}" \
            --services "${{ secrets.ECS_SERVICE_PRODUCTION }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "previous-task-def=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current task def: $CURRENT"

      - name: Download current production task definition
        run: |
          TASK_ARN=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER_PRODUCTION }}" \
            --services "${{ secrets.ECS_SERVICE_PRODUCTION }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_ARN" \
            --query taskDefinition \
            > task-def-prod.json

      - name: Confirm ECS container names are configured (vars || secrets)
        env:
          BACKEND_CTR: ${{ vars.ECS_CONTAINER_NAME_BACKEND || secrets.ECS_CONTAINER_NAME_BACKEND }}
          FRONTEND_CTR: ${{ vars.ECS_CONTAINER_NAME_FRONTEND || secrets.ECS_CONTAINER_NAME_FRONTEND }}
        run: |
          if [[ -z "${BACKEND_CTR// /}" ]] || [[ -z "${FRONTEND_CTR// /}" ]]; then
            echo "::error::ECS_CONTAINER_NAME_BACKEND / ECS_CONTAINER_NAME_FRONTEND are empty." \
              "Define them as Actions Variables **or** Secrets (Settings → Secrets and variables)."
            exit 1
          fi

      - name: Render task definition (production backend image)
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-def-prod.json
          container-name:   ${{ vars.ECS_CONTAINER_NAME_BACKEND || secrets.ECS_CONTAINER_NAME_BACKEND }}
          image:            ${{ steps.ecs_images.outputs.backend_image }}

      - name: Render task definition (production frontend image)
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  ${{ steps['task-def-backend'].outputs['task-definition'] }}
          container-name:   ${{ vars.ECS_CONTAINER_NAME_FRONTEND || secrets.ECS_CONTAINER_NAME_FRONTEND }}
          image:            ${{ steps.ecs_images.outputs.frontend_image }}

      - name: Deploy to ECS production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps['task-def-frontend'].outputs['task-definition'] }}
          service:                    ${{ secrets.ECS_SERVICE_PRODUCTION }}
          cluster:                    ${{ secrets.ECS_CLUSTER_PRODUCTION }}
          wait-for-service-stability: true

  # ──────────────────────────────────────────────────────────────
  # 6. Observe — poll CloudWatch alarms for 5 minutes post-deploy
  #    as a belt-and-suspenders check on top of ECS's own alarm.
  # ──────────────────────────────────────────────────────────────
  observe:
    name: Observe production (5 min)
    runs-on: ubuntu-latest
    needs: deploy-production

    permissions:
      id-token: write
      contents: read

    outputs:
      alarm-state: ${{ steps['check-alarm'].outputs['alarm-state'] }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region:     ${{ env.AWS_REGION }}

      # Wait for traffic to hit the new revision before sampling
      - name: Wait 3 minutes for traffic to normalise
        run: sleep 180

      - name: Check CloudWatch alarm state
        id: check-alarm
        run: |
          STATE=$(aws cloudwatch describe-alarms \
            --alarm-names "${{ secrets.CW_ALARM_PRODUCTION }}" \
            --query 'MetricAlarms[0].StateValue' \
            --output text)

          echo "Alarm state: $STATE"
          echo "alarm-state=$STATE" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "ALARM" ]; then
            echo "CloudWatch alarm is in ALARM state — triggering rollback"
            exit 1
          fi

          echo "Production looks healthy."

  # ──────────────────────────────────────────────────────────────
  # 7. Rollback — only runs if observe fails
  #    Reverts ECS service to the previous task definition revision.
  # ──────────────────────────────────────────────────────────────
  rollback:
    name: Auto rollback
    runs-on: ubuntu-latest
    needs: [deploy-production, observe]
    if: ${{ failure() && needs['deploy-production'].result == 'success' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Roll back to previous task definition
        run: |
          PREVIOUS="${{ needs['deploy-production'].outputs['previous-task-def'] }}"
          echo "Rolling back to: $PREVIOUS"

          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_PRODUCTION }}" \
            --service "${{ secrets.ECS_SERVICE_PRODUCTION }}" \
            --task-definition "$PREVIOUS" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_PRODUCTION }}" \
            --services "${{ secrets.ECS_SERVICE_PRODUCTION }}"

          echo "Rollback complete — $PREVIOUS is live"

      - name: Alert Slack on rollback
        if: always()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 *Auto-rollback triggered* on production\nCommit: `${{ env.DEPLOY_SHA }}`\nCause: CloudWatch alarm breached\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

  # ──────────────────────────────────────────────────────────────
  # 8. Notify — success notification + audit record
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify & audit log
    runs-on: ubuntu-latest
    needs: [sign-image, deploy-production, observe]
    if: ${{ success() }}

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate changelog since last tag
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")
          CHANGES=$(git log "$LAST_TAG"..HEAD \
            --pretty=format:"• %s (%h)" \
            --no-merges | head -15)
          echo "CHANGES<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGES"     >> "$GITHUB_ENV"
          echo "EOF"          >> "$GITHUB_ENV"

      - name: Post success to Slack
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ *Production deployment successful*",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title":"Repo",       "value":"${{ github.repository }}", "short":true},
                  {"title":"Commit",     "value":"`${{ env.DEPLOY_SHA }}`",       "short":true},
                  {"title":"Actor",      "value":"${{ github.actor }}",        "short":true},
                  {"title":"Region",     "value":"${{ env.AWS_REGION }}",      "short":true},
                  {"title":"Backend image",  "value":"`${{ needs['sign-image'].outputs.backend_image_uri }}`", "short":false},
                  {"title":"Frontend image", "value":"`${{ needs['sign-image'].outputs.frontend_image_uri }}`", "short":false},
                  {"title":"Run",        "value":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short":false}
                ]
              }]
            }'

      - name: Write deployment audit record
        run: |
          mkdir -p audit
          cat > audit/deploy-$(date +%Y%m%d-%H%M%S).json << EOF
          {
            "timestamp":    "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit":       "${{ env.DEPLOY_SHA }}",
            "actor":        "${{ github.actor }}",
            "backend_image_uri":    "${{ needs['sign-image'].outputs.backend_image_uri }}",
            "backend_digest":       "${{ needs['sign-image'].outputs.backend_image_digest }}",
            "frontend_image_uri":   "${{ needs['sign-image'].outputs.frontend_image_uri }}",
            "frontend_digest":      "${{ needs['sign-image'].outputs.frontend_image_digest }}",
            "environment":  "production",
            "aws_region":   "${{ env.AWS_REGION }}",
            "cluster":      "${{ secrets.ECS_CLUSTER_PRODUCTION }}",
            "service":      "${{ secrets.ECS_SERVICE_PRODUCTION }}",
            "workflow":     "${{ github.workflow }}",
            "run_id":       "${{ github.run_id }}"
          }
          EOF
          cat audit/*.json

      - name: Upload audit record as artifact (90 day retention)
        uses: actions/upload-artifact@v4
        with:
          name:            deploy-audit-${{ env.DEPLOY_SHA }}
          path:            audit/
          retention-days:  90