# Build and push backend + frontend images to ECR only (no tests, lint, or scans).
# Requires repo Variables: AWS_ACCOUNT_ID, AWS_REGION — Secret: AWS_ROLE_ARN (OIDC role for ECR push).
# Image path: {AWS_ACCOUNT_ID}.dkr.ecr.{region}.amazonaws.com/{repo.name}/backend|frontend:latest
# Your ECS stack expects repositories planify/backend and planify/frontend when the GitHub repo is named planify.
name: ECR push (short)

on:
  workflow_dispatch:
  push:
    branches: [integrate, master]

env:
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read
  id-token: write

jobs:
  push-ecr:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pushed image URIs
        run: |
          echo "backend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest"
          echo "frontend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest"
