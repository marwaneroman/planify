# Lint → Secret Scan → SAST → Unit Tests → Dependency Audit → Build → Container Scan → Integration → E2E → Push → Deploy 
name: CI/CD

on:
  push:
    branches: [integrate, master]
  pull_request:
    branches: [integrate, master]

env:
  NODE_VERSION: "20"
  # AWS ECR settings — set AWS_ACCOUNT_ID and AWS_REGION as repo variables,
  # and AWS_ROLE_ARN as a repo secret.
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read
  id-token: write   # required for OIDC → AWS role assumption

jobs:

# 9. PUSH IMAGES TO AWS ECR
  push-images:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest
    #needs: [integration-tests, e2e-tests]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR repositories exist
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.IMAGE_NAME }}/backend" "${{ env.IMAGE_NAME }}/frontend" \
            --region ${{ vars.AWS_REGION }}

      # --- Push backend ---
      - name: Build and push backend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Push frontend ---
      - name: Build and push frontend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Output the full image URIs for downstream use (e.g. ECS task definition update)
      - name: Output pushed image URIs
        run: |
          echo "backend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}"
          echo "frontend=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}"
