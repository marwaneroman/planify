# Lint → Secret Scan → SAST → Unit Tests → Dependency Audit → Build → Container Scan → Integration → E2E → Push → Deploy 
name: CI/CD

on:
  push:
    branches: [integrate, master]
  pull_request:
    branches: [integrate, master]

env:
  NODE_VERSION: "20"
  # AWS ECR settings — set AWS_ACCOUNT_ID and AWS_REGION as repo variables,
  # and AWS_ROLE_ARN as a repo secret.
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read
  id-token: write   # required for OIDC → AWS role assumption

jobs:

# 5. BUILD DOCKER IMAGES (local)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-version: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          #role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-to-assume: arn:aws:iam::561410231123:role/Github-OIDC
          aws-region: us-east-1
          #aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: OIDC Test
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --- Backend ---
      - name: Build backend image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true  # load into local daemon for scanning
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend ---
      - name: Build frontend image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max