AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions IAM role (OIDC) for CI - push/pull ECR images planify/backend and planify/frontend.
  Create the GitHub OIDC provider once per account before deploying this stack, then pass its ARN.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or username that owns the repository.

  GitHubRepo:
    Type: String
    Description: Repository name only (e.g. planify).

  GithubOidcProviderArn:
    Type: String
    Description: >
      IAM OIDC provider ARN for GitHub Actions, e.g.
      arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com

  RoleName:
    Type: String
    Default: github-planify-ecr-ci
    Description: >
      Base name for the IAM role. The deployed role name is this value plus a hyphen and the stack
      region (e.g. github-planify-ecr-ci-us-east-2), because IAM role names are global per account and
      a single fixed name would prevent deploying this stack in a second region.

Resources:
  GithubActionsEcrRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      Policies:
        - PolicyName: EcrPushPlanify
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/planify/backend
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/planify/frontend

Outputs:
  GithubActionsEcrRoleArn:
    Description: GitHub secret AWS_ROLE_ARN for CI push-images.
    Value: !GetAtt GithubActionsEcrRole.Arn
