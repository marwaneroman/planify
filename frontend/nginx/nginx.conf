worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Override compile-time --http-log-path=/var/log/nginx/access.log (symlinks to
    # /dev/stdout break for non-root workers in ECS/Docker).
    access_log /tmp/nginx-access.log;
    error_log  /tmp/nginx-http-error.log warn;

    # Enable gzip compression for frontend assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # Rate limiting for API endpoints (protect backend)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Security headers applied globally (optional)
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";

    # Include all server blocks in conf.d
    include /etc/nginx/conf.d/*.conf;
}